# Merge into the client's Codex config; replace both absolute paths.
[mcp_servers.dreamer-writing]
command = "/bin/sh"
args = ["/absolute/path/to/dreamer/scripts/dreamer-writing-mcp.sh"]

[mcp_servers.dreamer-writing.env]
DREAMER_URL = "http://127.0.0.1:4327"
DREAMER_NODE_BIN = "/absolute/path/to/node"
DREAMER_WRITING_CLIENT_ID = "codex-local"
